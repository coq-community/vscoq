on:
  release:
    types:
    - released

jobs:

  publish-opam-package:
    strategy:
      matrix:
        os: [ubuntu-latest]
        ocaml-compiler: [4.14.x]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Use OCaml ${{ matrix.ocaml-compiler }}
      uses: avsm/setup-ocaml@f92e0606b7ae4873dd1238465ea4bf6f8e40d85c  # v3.7.2
      with:
        ocaml-compiler: ${{ matrix.ocaml-compiler }}

    - name: Install opam-publish
      run: opam install -y -j 2 opam-publish=2.5.0

    - name: Inject slug/short variables
      uses: rlespinasse/github-slug-action@797d68864753cbceedc271349d402da4590e6302  # v4.5.0

    - uses: webfactory/ssh-agent@d4b9b8ff72958532804b70bbe600ad43b36d5f2e  # v0.8.0
      with:
          ssh-private-key: ${{ secrets.BOT_SSH_KEY }}

    - name: Write PAT
      env:
        OPAM_PUBLISH_TOKEN: ${{ secrets.OPAM_PUBLISH_TOKEN }}
      run: |
        mkdir -p ~/.opam/plugins/opam-publish
        printf "$OPAM_PUBLISH_TOKEN" > ~/.opam/plugins/opam-publish/vscoqbot.token

    - name: Publish release on opam
      if: ${{ !github.event.release.prerelease }}
      run: |
        eval $(opam env)
        VERSION_SLUG="${GITHUB_REF_NAME}"
        VERSION="${VERSION_SLUG#v}"
        cd language-server
        git config --global user.name vscoqbot
        git config --global user.email vscoqbot@inria.fr
        opam publish --no-confirmation --no-browser -v $VERSION https://github.com/rocq-prover/vsrocq/releases/download/$VERSION_SLUG/vsrocq-language-server-$VERSION.tar.gz vsrocq-language-server.opam vscoq-language-server.opam

    - name: Publish prerelease on coq/opam
      if: ${{ github.event.release.prerelease }}
      run: |
        eval $(opam env)
        VERSION_SLUG="${GITHUB_REF_NAME}"
        VERSION="${VERSION_SLUG#v}"
        cd language-server
        git config --global user.name vscoqbot
        git config --global user.email vscoqbot@inria.fr
        opam publish --no-confirmation --no-browser --packages-directory=extra-dev/packages --repo=rocq-prover/opam -v $VERSION https://github.com/rocq-prover/vsrocq/releases/download/$VERSION_SLUG/vsrocq-language-server-$VERSION.tar.gz vsrocq-language-server.opam vcoq-language-server.opam
